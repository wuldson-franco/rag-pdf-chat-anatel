<div class="ctl">
<button id="prev" aria-label="Etapa anterior">&larr; Anterior</button>
<button id="pp" aria-label="Pausar ou continuar">Pausar</button>
<button id="next" aria-label="Próxima etapa">Próxima &rarr;</button>
</div>
<p class="hint">As etapas passam sozinhas a cada 1,4 segundo.</p>
</main>
<script>
var N=10, STEP=1400, FIRST={"n0": 0, "n1": 1, "n2": 2, "n3": 3, "n4": 4, "n5": 5, "n6": 6, "n7": 7, "n9": 8, "n8": 8};
function anims(){return document.getAnimations().filter(function(a){return a.effect&&a.effect.target&&a.effect.target.closest&&a.effect.target.closest('svg');});}
function cur(){var a=anims()[0];if(!a)return 0;var t=(a.currentTime||0)%(14*1000);return Math.floor(t/STEP);}
function pauseAll(){anims().forEach(function(a){a.pause();});document.getElementById('pp').textContent='Continuar';}
function playAll(){anims().forEach(function(a){a.play();});document.getElementById('pp').textContent='Pausar';}
function go(i){i=(i+N)%N;pauseAll();anims().forEach(function(a){a.currentTime=(i+0.5)*STEP;});}
document.getElementById('pp').onclick=function(){var a=anims()[0];if(a&&a.playState==='paused')playAll();else pauseAll();};
document.getElementById('next').onclick=function(){go(cur()+1);};
document.getElementById('prev').onclick=function(){go(cur()-1);};
Object.keys(FIRST).forEach(function(k){var el=document.getElementById('card_'+k);if(el)el.addEventListener('click',function(){go(FIRST[k]);});});
</script>
